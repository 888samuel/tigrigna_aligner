name: Align Tigrinya VO

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: video_id written into timed-script.json
        required: true
        default: episode
      audio_file:
        description: Path to audio/video under the repo (relative)
        required: true
        default: inputs/output.mp3
      script_file:
        description: Path to script under the repo (docx/txt/pdf/…)
        required: true
        default: inputs/script.docx
      engine:
        description: "auto (MMS CTC) | hierarchy (fast) | mms"
        required: true
        default: auto
      language:
        description: Whisper language hint (only if engine=whisper)
        required: false
        default: am

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install base Python dependencies
        run: pip install -r requirements.txt

      - name: Install MMS forced-aligner (Tigrinya CTC)
        if: ${{ inputs.engine == 'auto' || inputs.engine == 'mms' }}
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-mms.txt

      - name: Verify inputs exist
        run: |
          set -euo pipefail
          AUDIO="${{ inputs.audio_file }}"
          SCRIPT="${{ inputs.script_file }}"
          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: audio not found: $AUDIO"
            ls -la inputs || true
            exit 1
          fi
          if [ ! -f "$SCRIPT" ]; then
            echo "ERROR: script not found: $SCRIPT"
            ls -la inputs || true
            exit 1
          fi
          echo "Audio:  $AUDIO ($(du -h "$AUDIO" | cut -f1))"
          echo "Script: $SCRIPT"

      - name: Run aligner
        run: |
          set -euo pipefail
          mkdir -p output
          python align.py \
            --audio "${{ inputs.audio_file }}" \
            --script "${{ inputs.script_file }}" \
            --output output/timed-script.json \
            --video-id "${{ inputs.video_id }}" \
            --engine "${{ inputs.engine }}" \
            --device cpu \
            --mms-language tir
          echo "---- timed-script preview ----"
          python -c "import json; d=json.load(open('output/timed-script.json',encoding='utf-8')); print('mode', d.get('meta',{}).get('mode')); print('phrases', len(d.get('segments',[]))); print('needs_review', d.get('stats',{}).get('needs_review_count')); print('mean_confidence', d.get('stats',{}).get('mean_confidence')); print('mms', d.get('meta',{}).get('mms'))"

      - name: Upload timed-script artifact
        uses: actions/upload-artifact@v4
        with:
          name: timed-script-${{ inputs.video_id }}
          path: output/timed-script.json
          if-no-files-found: error
